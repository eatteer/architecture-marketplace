# The server the image runs: static files and nothing else. Copied into the image as
# /etc/nginx/conf.d/default.conf, inside nginx's own http block, once the Dockerfile has written the
# API's address in place of __VITE_API_URL__.

# Vite names every file under /assets/ after a hash of its content, so a file there never changes and
# can be kept for a year. index.html keeps its name across deployments and names the current assets:
# the browser asks again every time, or it keeps loading a deployment that no longer exists. Only a
# file that was found is kept: a 404 cached for a year would outlive the deployment that fixes it.
map "$status:$uri" $cache_control {
  ~^200:/assets/ "public, max-age=31536000, immutable";
  default        "no-cache";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # On the server, never inside a location: a location that adds a header of its own drops every
  # header inherited from here.
  add_header Cache-Control $cache_control always;
  # Scripts, styles and fonts come from this origin and requests go to the API alone: an injected
  # script has nowhere to load from and nowhere to send what it reads. The positions React writes on an
  # element go through the DOM, which style-src does not govern. No page may frame this one, which is
  # the defence against clickjacking.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' __VITE_API_URL__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Strict-Transport-Security belongs to whatever terminates TLS in front of this container; over the
  # plain HTTP this server speaks, browsers ignore it.

  # A missing asset is a 404, never index.html: a chunk from a replaced deployment has to fail to load,
  # so the page notices and reloads (its `vite:preloadError` handler), instead of parsing HTML as
  # JavaScript.
  location /assets/ {
    try_files $uri =404;
  }

  # Every other path is a route of the single-page application, which the router resolves in the
  # browser — including the ones that do not exist, which it answers with its own not-found page.
  location / {
    try_files $uri /index.html;
  }
}
